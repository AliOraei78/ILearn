services:
  postgres:
    image: ilearn-postgres:local
    build:
      context: ./deployment
      dockerfile: Postgres.Dockerfile
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_DB: ilearn
      POSTGRES_USER: ilearn
      POSTGRES_PASSWORD: "${ILEARN_DB_PASSWORD:?Set ILEARN_DB_PASSWORD}"
    ports:
      - "127.0.0.1:${ILEARN_DB_PORT:-5441}:5432"
    volumes:
      - ilearn-postgres-v2:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ilearn -d ilearn"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  database-setup:
    image: ilearn-postgres:local
    pull_policy: never
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ilearn
      PGUSER: ilearn
      PGPASSWORD: "${ILEARN_DB_PASSWORD:?Set ILEARN_DB_PASSWORD}"
      ILEARN_APP_DB_PASSWORD: "${ILEARN_APP_DB_PASSWORD:?Set ILEARN_APP_DB_PASSWORD}"
    volumes:
      - ./deployment/init-database.sql:/scripts/init-database.sql:ro
    command: ["psql", "-f", "/scripts/init-database.sql"]
    restart: "no"
  ilearn:
    depends_on:
      postgres:
        condition: service_healthy
      database-setup:
        condition: service_completed_successfully
    build: .
    image: ilearn:local
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "127.0.0.1:${ILEARN_PORT:-5081}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Local-only Compose port binding; public hosts still require HTTPS.
      Security__AllowLocalHttp: "true"
      Auth__CodeKey: "${AUTH_CODE_KEY:?Set AUTH_CODE_KEY}"
      EmailSettings__Host: "${SMTP_HOST:-}"
      EmailSettings__Port: "${SMTP_PORT:-587}"
      EmailSettings__UserName: "${SMTP_USERNAME:-}"
      EmailSettings__Password: "${SMTP_PASSWORD:-}"
      EmailSettings__FromEmail: "${SMTP_FROM_EMAIL:-}"
      ConnectionStrings__ILearn: "Host=postgres;Database=ilearn;Username=ilearn_app;Password=${ILEARN_APP_DB_PASSWORD};GssEncryptionMode=Disable"
      OpenRouter__ApiKey: "${OPENROUTER_API_KEY:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./ILearn/App_Data:/app/App_Data
      # Windows DPAPI keys cannot be reused inside the Linux container.
      - docker-keys:/app/App_Data/keys
    restart: unless-stopped

volumes:
  ilearn-postgres-v2:
  docker-keys:
